{% comment %}
Shared cross-room navigation bar. Include this in each room template, e.g.:
include 'ai_rooms/_rooms_nav.html' with active='repair_atlas'
{% endcomment %}
<style>
    .rooms-nav {
        display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
        padding: 10px 16px; background: rgba(28,36,48,0.04);
        border-bottom: 1px solid #E6E1D8;
    }
    .rooms-nav a {
        display: inline-flex; align-items: center; gap: 6px;
        padding: 7px 12px; border-radius: 999px;
        background: rgba(28,36,48,0.06); color: #33427F;
        border: 1px solid #E6E1D8;
        text-decoration: none; font-size: 0.82rem; font-weight: 700;
        font-family: inherit; transition: all 0.15s;
    }
    .rooms-nav a:hover { background: rgba(28,36,48,0.06); color: #1C2430; }
    .rooms-nav a.active {
        background: #1E2A57;
        color: #FFFFFF; border-color: transparent;
    }
    .rooms-nav .sep { flex: 1; }
    .rooms-nav .history-link {
        color: #3A4049; font-size: 0.78rem;
        background: transparent; border-color: transparent;
    }
    .rooms-nav .history-link:hover { color: #33427F; background: transparent; }
</style>
<nav class="rooms-nav">
    <a href="{% url 'ai_rooms:hub' %}" {% if active == 'hub' %}class="active"{% endif %}>🧠 الهب</a>
    <a href="{% url 'smart_diagnostics:diagnostics-room' %}" {% if active == 'diagnostic_room' %}class="active"{% endif %}>🩺 غرفة التشخيص</a>
    <a href="{% url 'diagnostic_shop' %}" {% if active == 'auto_diagnostic' %}class="active"{% endif %}>🚗 خبير التشخيص</a>
    <a href="{% url 'repair_atlas:page' %}" {% if active == 'repair_atlas' %}class="active"{% endif %}>🔧 أطلس الإصلاح</a>
    <span class="sep"></span>
    <a href="{% url 'ai_rooms:history' %}" class="history-link"><i class="fas fa-clock-rotate-left"></i> تاريخ المحادثات</a>
</nav>
