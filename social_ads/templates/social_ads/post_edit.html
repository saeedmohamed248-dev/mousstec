{% extends "social_ads/_base.html" %}
{% block title %}تعديل بوست | Mouss Tec{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto">
  <h1 class="text-2xl font-black text-[#0f2c4c] mb-6">تعديل البوست</h1>
  <form method="post" class="card p-5 space-y-4">
    {% csrf_token %}
    {% for f in form %}
    <div>
      <label class="block text-sm font-bold text-slate-700 mb-1">{{ f.label }}</label>
      {{ f }}
      {% for e in f.errors %}<p class="text-xs text-red-500">{{ e }}</p>{% endfor %}
    </div>
    {% endfor %}
    {% if post.image_url %}<img src="{{ post.image_url }}" class="rounded-xl border" alt="preview">{% endif %}
    <div class="flex justify-between">
      <a href="{% url 'social_ads_studio' %}" class="text-sm text-slate-500 underline">رجوع</a>
      <button class="text-white font-bold px-6 py-2 rounded-xl btn-primary">حفظ</button>
    </div>
  </form>
</div>
<style>
  form input[type=text], form input[type=url], form input[type=datetime-local], form select, form textarea {
    width:100%; border:1px solid #cbd5e1; border-radius:.5rem; padding:.5rem .75rem; font-size:.875rem; font-family:'Cairo',sans-serif;
  }
</style>
{% endblock %}
