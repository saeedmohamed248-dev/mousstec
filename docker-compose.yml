# 🐳 Mouss Tec ERP — تشغيل كامل بأمر واحد على Droplet واحد
# الخدمات: postgres + redis + web(daphne) + celery worker + celery beat + caddy(HTTPS تلقائي)
#
# التشغيل:  bash deploy/deploy.sh   ← نشر من غير ما الموقع يقف + رجوع تلقائي لو النسخة الجديدة بايظة
#   (الأمر القديم «docker compose --env-file .env up -d --build» لسه شغال، بس الموقع بيقف دقيقة)
services:

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    # ارفع سقف الاتصالات لتفادي "sorry, too many clients already" مع daphne
    # (عدة threads) + celery worker/beat + أوامر الإدارة المتزامنة.
    # 🛡️ idle_session_timeout: أي اتصال فاضي ١٠ دقايق بيتقفل من ناحية Postgres — لو حصل تسريب
    #    اتصالات تاني (زي يوم «too many clients») بيتصلّح لوحده بدل ما الموقع يقع.
    command: ["postgres", "-c", "max_connections=200",
              "-c", "idle_session_timeout=600000",
              "-c", "idle_in_transaction_session_timeout=300000"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # 🐛 [FIX]: كان --appendonly yes (AOF) ⇒ كل عملية كاش بتتكتب على الهارد: Redis كتب ~٧٨ جيجا
    #    وخنق الهارد على Postgres (checkpoint خد ٦٢ ثانية والويب اداله «timeout» ⇒ 502).
    #    Redis هنا كاش + طابور Celery: نسخة كل ٥ دقايق (لو اتغيّر ١٠٠ مفتاح) كفاية، وسقف رامات
    #    بيمسح الأقدم من الكاش اللي ليه مدة بس (volatile-lru) — طابور المهام مالوش مدة فمايتمسحش.
    command: ["redis-server", "--appendonly", "no", "--save", "300", "100",
              "--maxmemory", "256mb", "--maxmemory-policy", "volatile-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 🔄 مهاجرات + قالب الشركات + الستاتيك — مرة واحدة قبل نسخ الويب (deploy/entrypoint.migrate.sh)
  migrate:
    build: .
    image: mousstec-web:${WEB_TAG:-latest}
    restart: "no"
    command: bash deploy/entrypoint.migrate.sh
    env_file: .env
    environment:
      CONN_MAX_AGE: "0"
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/1}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles

  web:
    build: .
    image: mousstec-web:${WEB_TAG:-latest}
    restart: unless-stopped
    command: bash deploy/entrypoint.web.sh
    # 🧑‍🤝‍🧑 نسختين: لو واحدة وقعت/اتعملها restart/بتتنشر، التانية بتخدم الناس (Caddy بيوزّع بينهم)
    deploy:
      replicas: ${WEB_REPLICAS:-2}
    labels:
      mousstec.autoheal: "true"
    # 💓 لو /healthz/ فشل ٣ مرات ورا بعض (دقيقة ونص) ⇒ autoheal بيعمل restart للنسخة دي بس
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz/', timeout=5)"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 120s
    env_file: .env
    environment:
      # 🛑 daphne (ASGI): مفيش اتصالات دائمة بقاعدة البيانات — كل طلب بيشتغل في thread مختلف
      #    وكان بيسيب اتصاله مفتوح ⇒ «too many clients already» والموقع كله 500. ثابت هنا عمداً
      #    (بيكسب على أي CONN_MAX_AGE في .env).
      CONN_MAX_AGE: "0"
      # داخل Docker لازم Redis يتوصل باسم الخدمة "redis" مش localhost.
      # بنحترم أي قيمة في .env لو موجودة، وإلا نستخدم كونتينر redis.
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/1}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    expose:
      - "8000"

  worker:
    build: .
    restart: unless-stopped
    # لازم الـ worker يسمع كل الطوابير المستخدمة في CELERY_TASK_ROUTES،
    # وإلا المهام المروّحة على heavy_ai_tasks (الطيار الآلي، بوستات المخزون،
    # A/B، وردود واتساب/ماسنجر) تفضل واقفة في Redis من غير ما تشتغل.
    command: celery -A erp_core worker -l info --concurrency=2 -Q default,heavy_ai_tasks,notifications,urgent_fintech_tasks,b2b_sync
    env_file: .env
    environment:
      CONN_MAX_AGE: ${CONN_MAX_AGE:-60}   # Celery threads ثابتة — الاتصال الدائم آمن هنا
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/1}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
    depends_on:
      - db
      - redis
      - web
    volumes:
      - media_data:/app/media

  beat:
    build: .
    restart: unless-stopped
    command: celery -A erp_core beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file: .env
    environment:
      CONN_MAX_AGE: ${CONN_MAX_AGE:-60}   # Celery threads ثابتة — الاتصال الدائم آمن هنا
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/1}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
    depends_on:
      - db
      - redis
      - web

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      BASE_DOMAIN: ${BASE_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - media_data:/srv/media:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

  # 🚑 حارس: أي نسخة ويب الـ healthcheck بتاعها «unhealthy» بيتعملها restart لوحدها (Docker نفسه
  #    مابيعملش ده). سكربت صغير شفاف على صورة Docker الرسمية — مفيش صور طرف تالت.
  autoheal:
    image: docker:27-cli
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command:
      - sh
      - -c
      - |
        echo "🚑 autoheal شغال"
        while true; do
          for c in $$(docker ps -q --filter label=mousstec.autoheal=true --filter health=unhealthy); do
            echo "$$(date -u '+%F %T') unhealthy ⇒ restart $$(docker inspect -f '{{.Name}}' $$c)"
            docker restart -t 20 $$c
          done
          sleep 30
        done

volumes:
  pg_data:
  redis_data:
  media_data:
  static_data:
  caddy_data:
  caddy_config:
