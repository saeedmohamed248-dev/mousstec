{% load i18n %}
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>{% trans "استرجاع كلمة السر" %} | Mouss Tec</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/vendor/fontawesome/css/all.min.css">
    <style>
        :root { --bg:#0a1320; --bg2:#1a2332; --card:rgba(26,35,50,.85); --accent:#f59e0b;
                --success:#10b981; --danger:#ef4444; --text:#f8fafc; --muted:#94a3b8; }
        * { box-sizing: border-box; }
        body { font-family:'Cairo',sans-serif; background:linear-gradient(135deg,var(--bg),var(--bg2));
               color:var(--text); min-height:100vh; margin:0; display:flex; align-items:center;
               justify-content:center; padding:24px 16px; }
        .card { width:100%; max-width:420px; background:var(--card); border:1px solid rgba(255,255,255,.08);
                border-radius:20px; padding:32px 28px; box-shadow:0 20px 60px rgba(0,0,0,.35); }
        h1 { font-size:1.4rem; font-weight:900; margin:0 0 6px; }
        .sub { color:var(--muted); font-size:.92rem; margin:0 0 24px; line-height:1.7; }
        label { display:block; font-weight:700; font-size:.9rem; margin-bottom:6px; }
        input { width:100%; padding:12px 14px; border-radius:12px; border:1px solid rgba(255,255,255,.12);
                background:rgba(10,19,32,.7); color:var(--text); font-family:inherit; font-size:1rem; margin-bottom:16px; }
        input:focus { outline:2px solid var(--accent); border-color:transparent; }
        .code-input { letter-spacing:10px; text-align:center; font-size:1.4rem; font-weight:900; }
        button.main { width:100%; padding:13px; border:0; border-radius:12px; background:var(--accent); color:#0a1320;
                      font-family:inherit; font-weight:900; font-size:1rem; cursor:pointer; }
        button.main:disabled { opacity:.6; cursor:wait; }
        .link { background:none; border:0; color:var(--accent); font-family:inherit; font-weight:700;
                cursor:pointer; padding:0; font-size:.9rem; text-decoration:none; }
        .row { display:flex; justify-content:space-between; align-items:center; margin-top:16px; font-size:.9rem; }
        .alert { display:none; padding:12px 14px; border-radius:12px; margin-bottom:16px; font-size:.92rem; line-height:1.7; }
        .alert.show { display:block; }
        .alert.ok { background:rgba(16,185,129,.15); border:1px solid rgba(16,185,129,.4); }
        .alert.err { background:rgba(239,68,68,.15); border:1px solid rgba(239,68,68,.4); }
        .hint { color:var(--muted); font-size:.8rem; margin:-10px 0 16px; }
        .step { display:none; } .step.active { display:block; }
    </style>
</head>
<body>
<main class="card">
    <h1><i class="fas fa-key" style="color:var(--accent)"></i> {% trans "نسيت كلمة السر؟" %}</h1>
    <p class="sub">{% trans "اكتب رقم موبايلك أو إيميلك وهنبعتلك كود على الإيميل تعمل بيه كلمة سر جديدة." %}</p>

    <div id="alertBox" class="alert" role="status" aria-live="polite"></div>

    <!-- الخطوة ١: رقم الموبايل -->
    <section id="stepPhone" class="step active">
        <label for="phone">{% trans "رقم الموبايل أو الإيميل" %}</label>
        <input type="text" id="phone" dir="ltr" autocomplete="username"
               placeholder="01012345678 / name@mail.com" value="{{ prefill_phone }}">
        <button class="main" id="sendBtn" type="button">{% trans "ابعت الكود" %}</button>
    </section>

    <!-- الخطوة ٢: الكود + الباسورد الجديد -->
    <section id="stepCode" class="step">
        <label for="code">{% trans "الكود اللي وصلك" %}</label>
        <input type="text" id="code" class="code-input" dir="ltr" inputmode="numeric"
               autocomplete="one-time-code" maxlength="6" placeholder="••••••">
        <label for="newPassword">{% trans "كلمة السر الجديدة" %}</label>
        <input type="password" id="newPassword" autocomplete="new-password" minlength="8" placeholder="••••••••">
        <p class="hint">{% trans "٨ حروف على الأقل، ومتبقاش أرقام بس." %}</p>
        <button class="main" id="confirmBtn" type="button">{% trans "غيّر كلمة السر وادخل" %}</button>
        <div class="row">
            <button class="link" id="resendBtn" type="button">{% trans "ابعت كود تاني" %}</button>
            <button class="link" id="changePhoneBtn" type="button">{% trans "غيّر الرقم أو الإيميل" %}</button>
        </div>
    </section>

    <div class="row" style="justify-content:center; margin-top:24px;">
        <a class="link" href="/marketplace/automotive/?tab=login"><i class="fas fa-arrow-right"></i> {% trans "رجوع للدخول" %}</a>
    </div>
</main>

<script>
(function () {
    const $ = id => document.getElementById(id);
    function csrf() {
        const m = document.cookie.match(/(?:^|;\s*)mt_csrf=([^;]+)/);
        return m ? decodeURIComponent(m[1]) : '';
    }
    function alertMsg(text, ok) {
        const b = $('alertBox');
        b.textContent = text;           // textContent ⇒ مفيش HTML من السيرفر بيتنفّذ
        b.className = 'alert show ' + (ok ? 'ok' : 'err');
    }
    async function post(url, body) {
        const r = await fetch(url, {
            method: 'POST', credentials: 'same-origin',
            headers: {'Content-Type': 'application/json', 'X-CSRFToken': csrf()},
            body: JSON.stringify(body),
        });
        let data = {};
        try { data = await r.json(); } catch (e) { data = {error: '{% trans "حصلت مشكلة — حاول تاني." %}'}; }
        if (!r.ok) throw new Error(data.error || '{% trans "حصلت مشكلة — حاول تاني." %}');
        return data;
    }
    function show(step) {
        $('stepPhone').classList.toggle('active', step === 'phone');
        $('stepCode').classList.toggle('active', step === 'code');
        (step === 'code' ? $('code') : $('phone')).focus();
    }
    async function send(btn) {
        const phone = $('phone').value.trim();
        if (!phone) { alertMsg('{% trans "اكتب رقم الموبايل أو الإيميل" %}', false); return; }
        btn.disabled = true;
        try {
            const d = await post('/marketplace/password/forgot/send/', {phone});
            alertMsg(d.message, true);
            show('code');
        } catch (e) { alertMsg(e.message, false); }
        finally { btn.disabled = false; }
    }
    $('sendBtn').addEventListener('click', e => send(e.currentTarget));
    $('resendBtn').addEventListener('click', e => send(e.currentTarget));
    $('changePhoneBtn').addEventListener('click', () => show('phone'));
    $('phone').addEventListener('keydown', e => { if (e.key === 'Enter') send($('sendBtn')); });
    $('confirmBtn').addEventListener('click', async e => {
        const btn = e.currentTarget;
        btn.disabled = true;
        try {
            const d = await post('/marketplace/password/forgot/confirm/', {
                phone: $('phone').value.trim(), code: $('code').value.trim(),
                password: $('newPassword').value,
            });
            alertMsg(d.message, true);
            setTimeout(() => { window.location.href = d.redirect || '/marketplace/dashboard/'; }, 900);
        } catch (err) { alertMsg(err.message, false); btn.disabled = false; }
    });
})();
</script>
</body>
</html>
