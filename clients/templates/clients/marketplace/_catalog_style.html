{% load static %}<link rel="stylesheet" href="{% static 'css/mt-tokens.css' %}">
<link rel="stylesheet" href="/static/vendor/fontawesome/css/all.min.css">
<style>
    * { box-sizing:border-box; }
    body { margin:0; background:var(--mt-paper); color:var(--mt-ink); font-family:'IBM Plex Sans Arabic','Cairo',system-ui,sans-serif; }
    a { color:inherit; }
    .wrap { max-width:1180px; margin:0 auto; padding:0 16px; }
    .top { background:var(--mt-card); border-bottom:1px solid var(--mt-line); position:sticky; top:0; z-index:20; }
    .top .wrap { display:flex; align-items:center; gap:12px; padding-top:10px; padding-bottom:10px; }
    .brand { font-weight:800; text-decoration:none; display:flex; align-items:center; gap:8px; font-size:1.05rem; }
    .brand i { color:var(--mt-brand); }
    .top .sp { flex:1; }
    .top a.lnk { text-decoration:none; color:var(--mt-muted); font-size:.9rem; white-space:nowrap; }
    .hero { padding:22px 0 8px; }
    .hero h1 { margin:0 0 6px; font-size:1.6rem; font-weight:800; }
    .hero p { margin:0; color:var(--mt-muted); line-height:1.7; }
    .search { display:flex; gap:8px; margin:14px 0 6px; flex-wrap:wrap; }
    .search input, .search select { flex:1; min-width:160px; border:1px solid var(--mt-line-2); background:var(--mt-card); border-radius:12px; padding:11px 14px; font:inherit; }
    .search button { border:0; background:var(--mt-brand); color:#fff; border-radius:12px; padding:11px 20px; font:inherit; font-weight:700; cursor:pointer; }
    .chips { display:flex; gap:8px; overflow-x:auto; padding:8px 0 12px; scrollbar-width:none; }
    .chips::-webkit-scrollbar { display:none; }
    .chip { flex:0 0 auto; display:inline-flex; align-items:center; gap:6px; border:1px solid var(--mt-line-2); background:var(--mt-card); border-radius:999px; padding:7px 14px; font-size:.88rem; text-decoration:none; white-space:nowrap; }
    .chip.on { background:var(--mt-brand); border-color:var(--mt-brand); color:#fff; }
    .sec-title { font-weight:800; font-size:1.05rem; margin:14px 0 8px; display:flex; align-items:center; gap:8px; }
    .stores { display:flex; gap:10px; overflow-x:auto; padding-bottom:6px; scrollbar-width:thin; }
    .store { flex:0 0 200px; background:var(--mt-card); border:1px solid var(--mt-line); border-radius:14px; padding:12px; text-decoration:none; display:flex; gap:10px; align-items:center; }
    .store .ico { width:42px; height:42px; border-radius:12px; display:flex; align-items:center; justify-content:center; color:#fff; flex:0 0 auto; }
    .store b { display:block; font-size:.92rem; line-height:1.3; }
    .store small { color:var(--mt-muted); font-size:.78rem; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:12px; margin:8px 0 24px; }
    @media (max-width:520px) { .grid { grid-template-columns:repeat(2, 1fr); gap:10px; } }
    .card { background:var(--mt-card); border:1px solid var(--mt-line); border-radius:14px; overflow:hidden; display:flex; flex-direction:column; text-decoration:none; transition:box-shadow .15s, transform .15s; }
    .card:hover { box-shadow:0 6px 20px rgba(28,36,48,.08); transform:translateY(-2px); }
    .thumb { aspect-ratio:4/3; display:flex; align-items:center; justify-content:center; font-size:2.6rem; color:#fff; position:relative; }
    .thumb img { width:100%; height:100%; object-fit:cover; }
    .card .body { padding:10px 12px 12px; display:flex; flex-direction:column; gap:4px; flex:1; }
    .card h3 { margin:0; font-size:.95rem; line-height:1.45; font-weight:700; }
    .card .st { color:var(--mt-muted); font-size:.78rem; }
    .card .cta { margin-top:auto; padding-top:8px; font-weight:800; font-size:.85rem; color:var(--mt-brand); }
    .badge-mt { display:inline-flex; align-items:center; gap:4px; font-size:.72rem; color:var(--mt-muted); background:var(--mt-card-2); border:1px solid var(--mt-line); border-radius:999px; padding:2px 8px; }
    .pager { display:flex; justify-content:center; gap:8px; margin:0 0 30px; }
    .pager a, .pager span { border:1px solid var(--mt-line-2); background:var(--mt-card); border-radius:10px; padding:8px 14px; text-decoration:none; }
    .empty { text-align:center; color:var(--mt-muted); padding:40px 0; }
    .note { font-size:.82rem; color:var(--mt-muted); text-align:center; padding:0 0 24px; }
    .badges { display:flex; flex-wrap:wrap; gap:4px; }
    .bdg { display:inline-flex; align-items:center; gap:3px; font-size:.72rem; font-weight:700; border-radius:999px; padding:2px 8px; border:1px solid var(--mt-line); background:var(--mt-card-2); color:var(--mt-text); white-space:nowrap; }
    .bdg small { font-weight:400; color:var(--mt-muted); }
    .bdg.feat { background:#fff7ed; border-color:#fed7aa; color:#9a3412; }
    .bdg.rate { background:#fefce8; border-color:#fde68a; color:#854d0e; }
    .bdg.new { background:#eff6ff; border-color:#bfdbfe; color:#1e40af; }
    .bdg.plat { background:#eef2ff; border-color:#c7d2fe; color:#3730a3; }
    .hot { font-size:.75rem; color:#b45309; font-weight:700; }
    .ticker { display:flex; gap:8px; overflow-x:auto; padding:2px 0 8px; scrollbar-width:none; }
    .ticker::-webkit-scrollbar { display:none; }
    .tick { flex:0 0 auto; background:var(--mt-card); border:1px solid var(--mt-line); border-radius:12px; padding:8px 12px; font-size:.82rem; text-decoration:none; display:flex; gap:6px; align-items:center; }
    .tick .dot { width:8px; height:8px; border-radius:50%; background:#16a34a; flex:0 0 auto; }
    .sell { display:flex; gap:12px; align-items:center; flex-wrap:wrap; background:var(--mt-brand); color:#fff; border-radius:16px; padding:14px 16px; margin:18px 0; text-decoration:none; }
    .sell b { font-size:1rem; }
    .sell span.go { margin-inline-start:auto; background:#fff; color:var(--mt-brand); border-radius:10px; padding:8px 14px; font-weight:800; font-size:.9rem; }
    .review { background:var(--mt-card); border:1px solid var(--mt-line); border-radius:12px; padding:10px 12px; margin-bottom:8px; }
    .review .stars { color:#d97706; letter-spacing:1px; }
</style>
