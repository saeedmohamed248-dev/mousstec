<link rel="stylesheet" href="/static/vendor/fontawesome/css/all.min.css">
<style>
    :root { --ink:#1C2430; --navy:#1E2A57; --muted:#6B6F76; --line:#E6E1D8; --bg:#F5F3EE; --card:#fff; --soft:#FBF9F5;
            --amber:#b45309; --green:#16a34a; --red:#b91c1c; --violet:#6d28d9; }
    * { box-sizing:border-box; }
    body { font-family:'IBM Plex Sans Arabic','Cairo',sans-serif; background:var(--bg); color:var(--ink); margin:0; }
    a { color:inherit; }
    .container { max-width:1200px; margin:0 auto; padding:20px 16px 60px; }
    .breadcrumb { font-size:12px; color:var(--muted); margin-bottom:10px; }
    .breadcrumb a { color:var(--navy); text-decoration:none; }
    h1 { color:var(--navy); font-weight:900; margin:0 0 4px; font-size:24px; }
    .sub { color:var(--muted); font-size:13px; line-height:1.7; }
    .btn { display:inline-flex; gap:7px; align-items:center; border:1px solid transparent; border-radius:10px; padding:8px 13px;
           font:inherit; font-size:13px; font-weight:700; text-decoration:none; cursor:pointer; white-space:nowrap; }
    .btn-navy { background:var(--navy); color:#fff; } .btn-green { background:var(--green); color:#fff; }
    .btn-red { background:var(--red); color:#fff; } .btn-amber { background:var(--amber); color:#fff; }
    .btn-ghost { background:#fff; color:var(--navy); border-color:#CFC8BA; }
    .btn-sm { padding:5px 9px; font-size:12px; border-radius:8px; }
    .btn:hover { filter:brightness(.95); }
    .kpis { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; margin:16px 0 14px; }
    @media (max-width:760px) { .kpis { grid-template-columns:repeat(2,minmax(0,1fr)); } }
    .kpi { background:#fff; border:1px solid var(--line); border-radius:14px; padding:12px 14px; }
    .kpi .n { font-size:24px; font-weight:900; color:var(--navy); line-height:1.2; }
    .kpi .l { font-size:12px; color:var(--muted); }
    .toolbar { background:#fff; border:1px solid var(--line); border-radius:14px; padding:10px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
    .toolbar input[type=search], select.f { border:1px solid #D9D2C5; border-radius:10px; padding:8px 10px; font:inherit; font-size:13px; background:#fff; }
    .toolbar input[type=search] { flex:1; min-width:200px; }
    .tabs { display:flex; gap:6px; overflow-x:auto; margin:12px 0; padding-bottom:4px; }
    .tabs a { flex:0 0 auto; text-decoration:none; border:1px solid #D9D2C5; background:#fff; border-radius:999px; padding:6px 13px; font-size:13px; }
    .tabs a.on { background:var(--navy); color:#fff; border-color:var(--navy); }
    .card { background:#fff; border:1px solid var(--line); border-radius:16px; padding:14px 16px; margin-bottom:12px; }
    .pill { display:inline-flex; align-items:center; gap:4px; font-size:11.5px; font-weight:700; border-radius:999px; padding:2px 9px; border:1px solid var(--line); background:var(--soft); white-space:nowrap; }
    .pill.live { background:#dcfce7; color:#166534; border-color:#bbf7d0; } .pill.off { background:#f1f5f9; color:#475569; }
    .pill.bad { background:#fee2e2; color:#991b1b; border-color:#fecaca; } .pill.new { background:#eff6ff; color:#1e40af; border-color:#bfdbfe; }
    .pill.warn { background:#fef3c7; color:#92400e; border-color:#fde68a; }
    .meter { height:6px; background:var(--line); border-radius:999px; overflow:hidden; min-width:60px; }
    .meter > span { display:block; height:100%; background:var(--green); }
    .muted { color:var(--muted); }
    table.t { width:100%; border-collapse:collapse; font-size:13px; }
    table.t th, table.t td { text-align:start; padding:9px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
    table.t th { color:var(--muted); font-weight:700; font-size:12px; background:var(--soft); position:sticky; top:0; }
    .flash { border-radius:12px; padding:10px 14px; margin:10px 0; font-weight:700; background:#ecfdf5; border:1px solid #a7f3d0; color:#065f46; }
    .flash.error { background:#fef2f2; border-color:#fecaca; color:#991b1b; }
    .chips { display:flex; flex-wrap:wrap; gap:5px; }
    @media (max-width:760px) { .hide-sm { display:none; } table.t td, table.t th { padding:7px 5px; } }
</style>
