name: mousstec_mobile
description: تطبيق Mouss Tec للورش والمطابع — أندرويد و iOS (Flutter). أوامر الشغل والمخزون للورش، والطلبات ولوحة الإنتاج للمطابع.
publish_to: "none"
version: 1.1.0+2

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.0
  provider: ^6.1.1
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.2.2
  intl: ^0.20.2
  mobile_scanner: ^7.5.0
  fl_chart: ^0.68.0
  pdf: ^3.11.1
  printing: ^5.13.2
  firebase_core: ^5.2.0
  firebase_messaging: ^17.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.png

# 🎨 أيقونة التطبيق وشاشة البداية (python3 tool/setup_native.py بيولّدهم)
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon.png
  remove_alpha_ios: true
  background_color_ios: "#ffffff"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: assets/icon/icon.png

flutter_native_splash:
  color: "#ffffff"
  image: assets/icon/icon.png
  android_12:
    color: "#ffffff"
    image: assets/icon/icon.png
