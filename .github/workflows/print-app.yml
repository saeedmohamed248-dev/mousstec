# 🖨️ تطبيق Mousstec Print (سوق المطابع) — بناء AAB موقّع لـ Google Play
#
# التشغيل: Actions ← «Print App» ← Run workflow  (أو أي push بيغيّر print_app/)
# التوقيع بنفس مفتاح Mousstec: ANDROID_KEYSTORE_BASE64 · ANDROID_KEYSTORE_PASSWORD · ANDROID_KEY_ALIAS · ANDROID_KEY_PASSWORD
# الناتج: Artifacts ← mousstec-print-aab-<رقم> (ترفعه يدوي على Play Console)
# رقم الإصدار (versionCode) = رقم التشغيل — بيزيد لوحده، فمفيش رفعة بتترفض بسببه.
name: Print App

on:
  workflow_dispatch:
  push:
    branches: [main, 'feature/mousstec-print-app']
    paths: ['print_app/**', '.github/workflows/print-app.yml']

concurrency:
  group: print-app
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: print_app

jobs:
  android:
    name: 🤖 Mousstec Print — AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: الحزم
        run: npm install --no-audit --no-fund
      - name: مشروع أندرويد + الأيقونات
        run: |
          npx cap add android
          npm run assets
          npx cap sync android
      - name: إصدار أندرويد (minSdk 24 · targetSdk 36 · versionCode)
        run: |
          set -e
          perl -pi -e 's/minSdkVersion\s*=\s*\d+/minSdkVersion = 24/' android/variables.gradle
          perl -pi -e 's/(compileSdkVersion|targetSdkVersion)\s*=\s*\d+/$1 = 36/' android/variables.gradle
          perl -pi -e "s/versionCode \d+/versionCode ${{ github.run_number }}/" android/app/build.gradle
          grep -E "SdkVersion" android/variables.gradle
          grep -E "versionCode" android/app/build.gradle
      - name: التأكد من المفتاح وكلمة السر
        run: |
          trim() { printf '%s' "$1" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' | tr -d '\n'; }
          printf '%s' "$KEYSTORE_B64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "SP=$(trim "$KS_PASS")" >> "$GITHUB_ENV"
          echo "KP=$(trim "$KEY_PASS")" >> "$GITHUB_ENV"
          echo "KA=$(trim "$KEY_ALIAS")" >> "$GITHUB_ENV"
      - name: بناء AAB
        working-directory: print_app/android
        run: |
          chmod +x ./gradlew
          ./gradlew bundleRelease
      - name: توقيع AAB
        run: |
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore "$RUNNER_TEMP/upload.jks" -storepass "$SP" -keypass "$KP" "$AAB" "$KA"
          jarsigner -verify "$AAB" | tail -1
          cp "$AAB" "mousstec-print-${{ github.run_number }}.aab"
      - uses: actions/upload-artifact@v4
        with:
          name: mousstec-print-aab-${{ github.run_number }}
          path: print_app/mousstec-print-${{ github.run_number }}.aab
          retention-days: 30
