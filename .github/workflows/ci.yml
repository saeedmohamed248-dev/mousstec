name: CI

# يشتغل على كل Pull Request وعلى الدفع المباشر لـ main.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────
  # 1) Lint — سريع، بدون قاعدة بيانات. يمسك أخطاء وقت التشغيل
  #    (أسماء غير معرّفة NameError، أخطاء .format، مقارنات خاطئة...).
  #    مجموعة القواعد منتقاة عشان تفشل فقط على الأخطاء الحقيقية، مش
  #    على ملاحظات التنسيق (طول السطر / استيرادات غير مستخدمة).
  # ──────────────────────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install "ruff==0.14.0"

      - name: Syntax check (compileall)
        run: python -m compileall -q .

      - name: Ruff — runtime-bug rules
        run: |
          ruff check --output-format=github \
            --select F821,F822,F823,F501,F502,F503,F504,F505,F506,F507,F508,F509,F521,F522,F523,F524,F525,F601,F602,F631,F632,F633,F701,F702,F706,F707,B006,B002,B011,B014,PLE \
            .

  # ──────────────────────────────────────────────────────────────
  # 2) Django check + tests — بقاعدة بيانات PostgreSQL و Redis حقيقيين
  #    (النظام يستخدم django-tenants فيلزمه Postgres، والاختبارات
  #    تنشئ schemas فعلية لكل tenant).
  # ──────────────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: erp_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: ci-insecure-test-key-not-for-production
      DEBUG: "True"
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/erp_db
      REDIS_URL: redis://localhost:6379/1
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/0
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Run tests
        run: python manage.py test --verbosity=2
