# 🧪 CI — يمسك الأخطاء قبل ما توصل للإنتاج/العميل
# job "lint": سريع وبدون قاعدة بيانات (سينتاكس بايثون + لينت القوالب).
# job "django": فحوصات Django الحقيقية على Postgres (مهاجرات + قوالب + اختبارات).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: 🧹 لينت سريع (سينتاكس + قوالب)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: فحص سينتاكس كل ملفات بايثون
        run: python -m compileall -q erp_core inventory clients billing hr omnichannel
      - name: لينت القوالب (تعليقات {# #} متعددة الأسطر)
        run: python scripts/lint_templates.py .
      - name: تثبيت ruff
        run: pip install "ruff==0.15.8"
      - name: لينت أخطاء وقت التشغيل (أسماء غير معرّفة / .format / مقارنات خاطئة)
        # مجموعة قواعد منتقاة تفشل فقط على الأخطاء اللي بتنهار وقت التشغيل
        # (NameError، KeyError في .format، مقارنات بـ is مع ثابت...) — نفس النوع
        # اللي اتصلّح في PR #27 — من غير ضجيج التنسيق (طول السطر/استيرادات
        # غير مستخدمة) عشان ما يعطّلش الشغل اليومي.
        run: |
          ruff check --output-format=github \
            --select F821,F822,F823,F501,F502,F503,F504,F505,F506,F507,F508,F509,F521,F522,F523,F524,F525,F601,F602,F631,F632,F633,B002,B006,B011,B014,PLE \
            .

  django:
    name: ✅ فحوصات Django (مهاجرات + قوالب + اختبارات)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: '123'
          POSTGRES_DB: erp_db
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SECRET_KEY: ci-secret-key-not-for-production
      DATABASE_URL: postgres://postgres:123@localhost:5432/erp_db
      DEBUG: '0'
      # 🤖 نطفّي ميزات الذكاء الاصطناعي في CI — فحص النظام (mousstec.E001) بيعتبر
      #    غياب مفتاح Gemini خطأ يوقف الأمر، والمفتاح مش موجود (ولا مفروض) في CI.
      ENABLE_AI_PREDICTIONS: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: تثبيت أدوات النظام (gettext لملفات الترجمة)
        run: sudo apt-get update && sudo apt-get install -y gettext
      - name: تثبيت الاعتماديات
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: فحص عدم وجود مهاجرات ناقصة (drift بين الموديل والمهاجرات)
        run: python manage.py makemigrations --check --dry-run
      - name: فحص صياغة القوالب العامة الحرجة (زي صفحة الدخول)
        # من غير --all: بيفشل بس لو قالب عام حرج (دخول/تسجيل/لاندنج) مكسور —
        # زي الإنتاج بالظبط. مابنفشلش على 5 قوالب مكتبات طرف ثالث (mptt/filer)
        # مش مستخدمة عندنا وموجودة مكسورة من الأصل. (لينت التعليقات في job اللينت.)
        run: python manage.py check_templates
      - name: تشغيل اختبارات سريعة موثوقة
        # سويت inventory كاملة بطيئة جداً في CI (كل كلاس بيعمل tenant schema
        # بكل المهاجرات — 15+ دقيقة وممكن تعتمد على Redis). فبنشغّل هنا مجموعة
        # سريعة وموثوقة: اختبارات منطق الميزات (بدون DB) + اختبار مبدّل الفروع
        # (منطقة صفحة الدخول اللي صلّحناها). السويت الكاملة تتشغّل قبل النشر.
        run: python manage.py test inventory.tests.test_fixit_part_numbers inventory.tests.test_branch_switcher -v2
