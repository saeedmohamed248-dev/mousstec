{% load i18n %}
<!-- 💸 سداد فاتورة شراء: جزء من المتبقّي أو المبلغ كامل — openPay(id, vendor, due) -->
<div id="pay-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/60 p-4">
  <form method="post" id="pay-form" class="bg-slate-900 border border-slate-700 rounded-2xl p-5 w-full max-w-md shadow-2xl">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ request.get_full_path }}">
    <div class="flex items-center justify-between mb-3">
      <h3 class="text-lg font-black text-white"><i class="fas fa-money-bill-transfer text-emerald-400 ml-1"></i> {% trans "سداد فاتورة" %} <span id="pay-inv" class="font-mono"></span></h3>
      <button type="button" onclick="closePay()" class="text-slate-400 hover:text-white"><i class="fas fa-times"></i></button>
    </div>
    <div class="text-sm text-slate-300 mb-3"><span id="pay-vendor" class="font-bold text-orange-300"></span> · {% trans "المتبقّي" %} <b id="pay-due" class="text-red-300"></b></div>
    <label class="block text-xs font-bold text-slate-300 mb-1">{% trans "المبلغ" %}</label>
    <div class="flex gap-2 mb-3">
      <input name="amount" id="pay-amount" type="number" step="0.01" min="0.01" required class="flex-1 bg-slate-900 text-white px-3 py-2 rounded-lg border border-slate-700">
      <button type="button" onclick="payFull()" class="text-xs font-bold px-3 rounded-lg bg-emerald-600/20 border border-emerald-500/40 text-emerald-300 hover:bg-emerald-600 hover:text-white">{% trans "المبلغ كامل" %}</button>
      <button type="button" onclick="payHalf()" class="text-xs font-bold px-3 rounded-lg bg-slate-700/40 border border-slate-600/40 text-slate-300 hover:bg-slate-600 hover:text-white">{% trans "النص" %}</button>
    </div>
    <label class="block text-xs font-bold text-slate-300 mb-1">{% trans "من خزنة" %}</label>
    <select name="treasury_id" required class="w-full bg-slate-900 text-white px-3 py-2 rounded-lg border border-slate-700 mb-3">
      <option value="">{% trans "— اختر الخزنة —" %}</option>
      {% for t in treasuries %}<option value="{{ t.id }}">{{ t.name }} · {{ t.branch.name }} ({{ t.balance|amount }})</option>{% endfor %}
    </select>
    <input name="note" placeholder="{% trans 'ملاحظة (اختياري) — رقم تحويل، شيك…' %}" class="w-full bg-slate-900 text-white px-3 py-2 rounded-lg border border-slate-700 mb-4">
    <button class="w-full bg-gradient-to-r from-emerald-600 to-teal-600 hover:brightness-110 text-white font-black py-3 rounded-xl"><i class="fas fa-check ml-1"></i> {% trans "تسجيل السداد" %}</button>
    <p class="text-[11px] text-slate-500 text-center mt-2">{% trans "الفلوس بتطلع من الخزنة، والمتبقّي على الفاتورة ومستحقات المورد بيقلّوا بنفس المبلغ." %}</p>
  </form>
</div>
<script>
(function () {
  const PAY_URL = "{% url 'inventory:purchase_pay' 0 %}";
  const modal = document.getElementById('pay-modal');
  let due = 0;
  window.openPay = (id, vendor, d) => {
    due = parseFloat(d) || 0;
    document.getElementById('pay-form').action = PAY_URL.replace('/0/', '/' + id + '/');
    document.getElementById('pay-inv').textContent = '#' + id;
    document.getElementById('pay-vendor').textContent = vendor;
    document.getElementById('pay-due').textContent = fmtMoney(due);
    const a = document.getElementById('pay-amount');
    a.max = due.toFixed(2); a.value = due.toFixed(2);
    modal.classList.remove('hidden'); modal.classList.add('flex');
    a.focus(); a.select();
  };
  window.closePay = () => { modal.classList.add('hidden'); modal.classList.remove('flex'); };
  window.payFull = () => { document.getElementById('pay-amount').value = due.toFixed(2); };
  window.payHalf = () => { document.getElementById('pay-amount').value = (Math.round(due * 50) / 100).toFixed(2); };
  modal.addEventListener('click', (e) => { if (e.target === modal) closePay(); });
})();
</script>
