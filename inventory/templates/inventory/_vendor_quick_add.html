{% load i18n %}
<!-- ➕ مورد جديد من غير ما تسيب الصفحة — openVendorModal(name?) ؛ بيضيفه لـ <select id="vendor"> ويختاره -->
<div id="vendor-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/60 p-4">
  <div class="bg-slate-900 border border-slate-700 rounded-2xl p-5 w-full max-w-md shadow-2xl">
    <div class="flex items-center justify-between mb-4">
      <h3 class="text-lg font-black text-white"><i class="fas fa-truck-field text-emerald-400 ml-1"></i> {% trans "مورد جديد" %}</h3>
      <button type="button" onclick="closeVendorModal()" class="text-slate-400 hover:text-white"><i class="fas fa-times"></i></button>
    </div>
    <div class="space-y-3">
      <div>
        <label class="block text-xs font-bold text-slate-300 mb-1">{% trans "اسم المورد / الشركة" %} *</label>
        <input id="nv-name" type="text" class="w-full bg-slate-950 text-white px-3 py-2.5 rounded-lg border border-slate-700 focus:border-emerald-400 focus:outline-none">
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-bold text-slate-300 mb-1">{% trans "رقم الهاتف" %}</label>
          <input id="nv-phone" type="text" dir="ltr" class="w-full bg-slate-950 text-white px-3 py-2.5 rounded-lg border border-slate-700 focus:border-emerald-400 focus:outline-none">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-300 mb-1">{% trans "الرقم الضريبي" %}</label>
          <input id="nv-tax" type="text" dir="ltr" class="w-full bg-slate-950 text-white px-3 py-2.5 rounded-lg border border-slate-700 focus:border-emerald-400 focus:outline-none">
        </div>
      </div>
      <p id="nv-msg" class="text-xs text-center"></p>
      <button type="button" id="nv-save" class="w-full bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-black py-3 rounded-xl transition"><i class="fas fa-floppy-disk ml-1"></i> {% trans "حفظ المورد" %}</button>
    </div>
  </div>
</div>
<script>
(function () {
  const URL_ = "{% url 'inventory:vendor_create' %}";
  const modal = document.getElementById('vendor-modal');
  const g = (id) => document.getElementById(id);
  const say = (m, cls) => { g('nv-msg').textContent = m; g('nv-msg').className = 'text-xs text-center ' + cls; };
  window.openVendorModal = (name) => {
    say('', ''); if (name) g('nv-name').value = name;
    modal.classList.remove('hidden'); modal.classList.add('flex'); g('nv-name').focus();
  };
  window.closeVendorModal = () => { modal.classList.add('hidden'); modal.classList.remove('flex'); };
  modal.addEventListener('click', (e) => { if (e.target === modal) closeVendorModal(); });
  g('nv-save').addEventListener('click', async () => {
    const name = g('nv-name').value.trim();
    if (!name) { say('{% trans "اكتب اسم المورد." %}', 'text-red-400'); return; }
    g('nv-save').disabled = true; say('{% trans "جارٍ الحفظ..." %}', 'text-slate-300');
    try {
      const r = await fetch(URL_, { method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value },
        body: JSON.stringify({ name, phone: g('nv-phone').value.trim(), tax_id: g('nv-tax').value.trim() }) });
      const data = await r.json();
      g('nv-save').disabled = false;
      if ((!r.ok || !data.ok) && !data.duplicate) { say(data.error || '{% trans "فشل الحفظ." %}', 'text-red-400'); return; }
      const sel = g('vendor');
      if (![...sel.options].some(o => o.value == String(data.id))) {
        const opt = document.createElement('option'); opt.value = data.id; opt.textContent = data.name; sel.appendChild(opt);
      }
      sel.value = String(data.id);
      sel.dispatchEvent(new Event('change'));
      g('nv-name').value = ''; g('nv-phone').value = ''; g('nv-tax').value = '';
      closeVendorModal();
      if (window.onVendorAdded) window.onVendorAdded(data);
    } catch { g('nv-save').disabled = false; say('{% trans "خطأ في الشبكة." %}', 'text-red-400'); }
  });
})();
</script>
