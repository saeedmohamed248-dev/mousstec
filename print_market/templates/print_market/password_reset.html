{% extends "print_market/base.html" %}{% load i18n %}
{% block title %}{% trans "كلمة سر جديدة" %}{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6 col-lg-5"><div class="pm-card p-4">
  <h1 class="fs-5 fw-bold mb-3">{% trans "كلمة سر جديدة" %}</h1>
  <form method="post">{% csrf_token %}
    <input name="password" type="password" class="form-control mb-3" required minlength="8" autocomplete="new-password">
    <button class="pm-btn w-100">{% trans "حفظ" %}</button>
  </form>
</div></div></div>
{% endblock %}
