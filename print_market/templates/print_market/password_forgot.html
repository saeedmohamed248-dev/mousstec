{% extends "print_market/base.html" %}{% load i18n %}
{% block title %}{% trans "نسيت كلمة السر" %}{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6 col-lg-5"><div class="pm-card p-4">
  <h1 class="fs-5 fw-bold mb-3">{% trans "نسيت كلمة السر" %}</h1>
  <form method="post">{% csrf_token %}
    <input name="email" type="email" class="form-control mb-3" required dir="ltr" placeholder="{% trans 'الإيميل' %}">
    <button class="pm-btn w-100">{% trans "ابعتلي لينك" %}</button>
  </form>
</div></div></div>
{% endblock %}
