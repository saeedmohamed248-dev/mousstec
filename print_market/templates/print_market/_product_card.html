{% load i18n %}<div class="col-6 col-md-4 col-lg-3">
  <a href="{% url 'print_market:product' p.pk %}" class="text-decoration-none text-reset">
    <div class="pm-card p-2 h-100">
      {% if p.image %}<img src="{{ p.image.url }}" class="pm-thumb" alt="{{ p.title }}" loading="lazy">
      {% else %}<div class="pm-thumb d-flex align-items-center justify-content-center"><i class="fas fa-print fa-2x pm-muted"></i></div>{% endif %}
      <div class="fw-bold mt-2">{{ p.title }}</div>
      <div class="small pm-muted">{{ p.shop.name }}{% if p.shop.city %} · {{ p.shop.city }}{% endif %}</div>
      {% if p.price_from %}<div class="small fw-bold" style="color:var(--pm)">{% trans "يبدأ من" %} {{ p.price_from|floatformat:"-2" }} {% trans "ج.م" %}{% if p.unit %} / {{ p.unit }}{% endif %}</div>{% endif %}
    </div>
  </a>
</div>
